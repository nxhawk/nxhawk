name: Goodreads Currently Reading

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zwacky/goodreads-profile-readme@main
        with:
          GOODREADS_USER_ID: "nxhawk"
          SHELF: "currently-reading"
          TEMPLATE: "- 📖 **{title}** by *{author}*"
          COMMENT_TAG: "GOODREADS-CURRENTLY-READING"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update currently reading books"
